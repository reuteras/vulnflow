# vulnflow glue: OpenCVE webhook receiver + periodic Dependency-Track -> DefectDojo sync.
#  - dt2dojo uses the host network so "localhost:8180/8280" in .env reach DT and
#    DefectDojo exactly as they do from the shell.
#  - receiver runs on a bridge network, published on 127.0.0.1 only. When OpenCVE is
#    installed, poc.sh adds docker-compose.glue-opencve.yml, which also attaches it to
#    OpenCVE's network as "vulnflow-receiver" so OpenCVE's webhook reaches it there.
name: vulnflow-glue

x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: vulnflow:local
  env_file: ../.env
  volumes:
    - ../inventory:/app/inventory:ro
    - vulnflow-data:/app/data
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  receiver:
    <<: *common
    command: ["serve", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:${VULNFLOW_PORT:-8380}:${VULNFLOW_PORT:-8380}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('VULNFLOW_PORT','8380')+'/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dt2dojo:
    <<: *common
    network_mode: host
    # every 30 minutes; DT re-analyses continuously, Dojo re-import is idempotent
    command: ["dt2dojo", "--loop", "1800"]

volumes:
  vulnflow-data: {}
