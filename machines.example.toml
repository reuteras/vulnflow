#:schema ./schemas/machines.schema.json
# Own hosts that push their SBOMs to Dependency-Track (scripts/vulnflow-agent.py).
#
#   cp machines.example.toml machines.toml
#
# machines.toml is gitignored and dockerignored, like .env: real host names and
# what runs where are targeting data. Keep the real file in a private place (your Ansible
# repo or vault) and copy it to the vulnflow server; set VULNFLOW_MACHINES in .env if it
# lives somewhere else. After a change: python3 -m vulnflow agent-bundle --all
#
# Teams are the [teams.*] keys of inventory/inventory.toml (sysadm, users, dev, network,
# virt, platform, workplace, msinfra, itmgmt, apps).

# ---- Groups: shared settings plus the hosts in them -------------------------------
# A host belongs to at most one group. Settings:
#   team             owner of the host project (DT project host:<name>)  required
#   kind             "linux" (default scans: system) or "macos" (brew, languages, apps)
#   scans            any of system | brew | languages | apps | containers
#                    containers: each running image becomes container:<image>, owned by
#                    containers_team (default dev); needs docker access for the agent
#   containers_team  owner of the container projects (default dev)
#   language_paths   directories under $HOME for the languages scan (default: uv tools,
#                    pipx venvs, ~/.cargo/bin, plus `npm root -g`)
[groups.servers]
team  = "sysadm"
kind  = "linux"
scans = ["system", "containers"]
hosts = ["server1", "server2", "server3"]

[groups.laptops]
team  = "users"
kind  = "macos"
scans = ["brew", "languages", "apps"]
hosts = ["laptop1", "laptop2"]

# ---- Per-host overrides (or a host without a group) ---------------------------------
# Any group setting, plus:
#   group    join a group without being in its hosts list
#   version  fixed DT project version (default: probed from the OS, e.g. debian-13)
[hosts.server1]
scans = ["system", "brew", "containers"]   # this one also has Homebrew

# ---- Application code ----------------------------------------------------------------
# A directory with the code *and* its installed dependencies (venv, node_modules) on one
# of the hosts above; that host's agent scans it into DT project code:<name>.
#   team     owner (default dev)
#   version  default: `git describe` in the directory
[code.myapp]
host = "server1"
path = "/srv/myapp"

# ---- Asset context: exposure and criticality (docs/exposure.md) ------------------------
# Set on what runs, never on a group: one group can run a public service and an internal
# admin page. Keys: exposure (internet | external-auth | internal | restricted |
# hostile-device), input (public | partner | staff), criticality (critical | high | normal |
# low), eol, certified and vendor (true/false; vendor = fixes come from the vendor, listed
# in the weekly report's vendor section), and with eol/certified an optional review date
# (review = 2027-03-01: the weekly report flags the accepted risk once it has passed). Unset
# stays unknown. They become Dependency-Track tags (exposure-internet, crit-high, ...) at
# the next dt2dojo round; preview with `python3 -m vulnflow context --unknown`.
# [hosts.server1]                  # the host project host:server1
# exposure = "internal"
# criticality = "normal"
# [hosts.server1.images]           # container projects on server1, by image name or glob
# "nginx" = { exposure = "internet", input = "public", criticality = "high" }
# "ghcr.io/acme/admin-*" = { exposure = "restricted", input = "staff" }
# "*" = { exposure = "internal" }  # the rest on this host (an exact name or longer glob wins)
# [hosts.server1.packages]         # packages in the host project (OS packages, modules in
# "nginx" = { exposure = "internet", input = "public" }   # its binaries); overrides the
# "openssh-server" = { exposure = "internet" }            # host's context when ranking
# [code.myapp] / [github.<name>] take the same keys.
# [projects."someapp"]             # any other project, e.g. uploaded from CI
# exposure = "external-auth"
# criticality = "critical"

# ---- CPE overrides for Homebrew and macOS apps ------------------------------------------
# Matched by CPE only; NVD's vendor can't be derived from Homebrew metadata (default guess:
# vendor = product). "<formula | cask | bundle id>" = "<nvd vendor>:<nvd product>".
[cpe_map]
# ripgrep = "burntsushi:ripgrep"
# "com.amazon.Lassen" = "amazon:kindle"

# ---- Extra OpenCVE subscriptions per team ---------------------------------------------
# Added to the team's [teams.<team>.opencve] in inventory/inventory.toml when
# `vulnflow sync` runs. Here rather than there because a detailed list shows your software
# stack and the repository is public. `python3 -m vulnflow suggest-subscriptions` prints
# candidates from what Dependency-Track has seen on the machines.
# [subscriptions.sysadm]
# vendors = ["nginx"]
# [subscriptions.sysadm.products]
# openbsd = ["openssh"]
# postgresql = ["postgresql"]

# ---- SBOMs from GitHub releases --------------------------------------------------------
# Projects that build on GitHub and attach a CycloneDX SBOM to each release. vulnflow pulls
# the newest one (python3 -m vulnflow github-sboms; dt2dojo every round), so GitHub needs no
# Dependency-Track key and no tailnet access. See docs/sboms.md "From GitHub releases".
# [github.someapp]                 # the Dependency-Track project name
# repo  = "owner/someapp"
# asset = "*.cdx.json"             # glob on the release asset names (default)
# team  = "dev"
# verify = { identity = "https://github.com/owner/someapp/.github/workflows/publish.yml@refs/tags/*" }
#                                  # optional: require a keyless cosign signature
#                                  # (<asset>.sig.bundle); `*` is the only wildcard

# ---- Newsletters (vulnflow newsletter weekly|daily|alert <id>) -------------------------
# Feeds are downloaded whole and filtered here, never searched per keyword. kind: advisory,
# cert, exploit (items count as a public exploit) or news. `teams` sends every item of the
# feed to those teams; without it, items are matched against every team. The URLs below
# are examples of public feeds: check each one before use, or use an internal mirror.
# [news.feeds.cisa]
# url = "https://www.cisa.gov/cybersecurity-advisories/all.xml"
# kind = "cert"
# [news.feeds.debian-dsa]
# url = "https://www.debian.org/security/dsa"
# [news.feeds.fortinet-psirt]
# url = "https://filestore.fortinet.com/fortiguard/rss/ir.xml"
# teams = ["network"]
# [news.feeds.exploit-db]
# url = "https://www.exploit-db.com/rss.xml"
# kind = "exploit"
# [news.feeds.securitynews]
# url = "https://www.bleepingcomputer.com/feed/"
# kind = "news"
#
# Where each team's newsletter goes (without `to`: one mail to VULNFLOW_REPORT_TO) and extra
# words to match.
# [news.teams.network]
# to = "network-team@example.org"
# keywords = ["fortigate", "anyconnect"]

# ---- Separate chat channels for noisy products --------------------------------------------
# The Linux kernel (and some vendors) publish so many CVEs that they drown the team's
# channel. A [chat.<channel>] section is a Mattermost channel only for the products you
# list; leave it out and nothing changes. CVEs matching `match` go there *instead of* the
# team's channel (naming the team in each line, no @mention); the SOC channel still gets
# every P1. One channel serves all teams: a CVE that several teams subscribe to is posted
# once, naming them all. New findings on your machines whose component CPE matches (DT's
# linux_kernel, say) go there too, one line per CVE naming every host. The match is on the subscription that made OpenCVE notify, so the
# product must be subscribed (above or in the inventory): a team subscribed to the whole
# vendor reports "linux", not "linux:linux_kernel" (chat-up warns). `./poc.sh chat-up`
# (rerun after a change) creates the channel and writes its webhook to
# VULNFLOW_CHAT_WEBHOOK_<NAME> in .env.
#   match     "vendor" (all its products) or "vendor:product", NVD names
#   min_tier  lowest tier posted, 1..4 (default: the team channel's, P2)
# [chat.linux-kernel]
# match = ["linux:linux_kernel"]
# [chat.microsoft]
# match = ["microsoft"]
# min_tier = 1

# ---- Decisions vulnflow applies by itself -------------------------------------------------
# A [triage.<name>] rule is a reviewed "does not affect us" that every dt2dojo round applies
# to the matching open findings, in every project and version, as a Dependency-Track
# analysis (suppressed) with the reason as comment. `vulnflow triage-rules` shows what it
# would do. A finding somebody already triaged is left alone; KEV-listed vulnerabilities
# are skipped unless allow_kev = true; `vulnflow unignore` takes the writes back. After
# review_by (at most a year ahead) the rule stops and its findings show up again.
#   vulnerabilities  ids; a finding's DT aliases count too (a CVE id covers its GHSA/PYSEC)
#   component        component name, case-insensitive
#   reason           why; becomes the analysis comment
#   review_by        a TOML date
#   state            NOT_AFFECTED (default), FALSE_POSITIVE, or EXPLOITABLE + response
#                    (WILL_NOT_FIX | CAN_NOT_FIX) for an accepted risk
#   justification    with NOT_AFFECTED: CODE_NOT_PRESENT, CODE_NOT_REACHABLE,
#                    REQUIRES_CONFIGURATION, REQUIRES_DEPENDENCY, REQUIRES_ENVIRONMENT,
#                    PROTECTED_BY_COMPILER, PROTECTED_AT_RUNTIME, PROTECTED_AT_PERIMETER,
#                    PROTECTED_BY_MITIGATING_CONTROL
#   versions, projects (fnmatch on the project name), teams: optional, narrow it down
# [triage.airflow-sqoop]
# vulnerabilities = ["PYSEC-2023-314"]
# component = "apache-airflow"
# projects = ["container:opencve-airflow-*"]
# justification = "CODE_NOT_PRESENT"
# reason = "apache-airflow-providers-sqoop is not installed"
# review_by = 2027-05-27
