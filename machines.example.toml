#:schema ./schemas/machines.schema.json
# Own hosts that push their SBOMs to Dependency-Track (scripts/vulnflow-agent.py).
#
#   cp machines.example.toml machines.toml
#
# machines.toml is gitignored and dockerignored, like .env: real host names and
# what runs where are targeting data. Keep the real file in a private place (your Ansible
# repo or vault) and copy it to the vulnflow server; set VULNFLOW_MACHINES in .env if it
# lives somewhere else. After a change: python3 -m vulnflow agent-bundle --all
#
# Teams are the [teams.*] keys of inventory/inventory.toml (sysadm, users, dev, network,
# virt, platform, workplace, msinfra, itmgmt, apps).

# ---- Groups: shared settings plus the hosts in them -------------------------------
# A host belongs to at most one group. Settings:
#   team             owner of the host project (DT project host:<name>)  required
#   kind             "linux" (default scans: system) or "macos" (brew, languages, apps)
#   scans            any of system | brew | languages | apps | containers
#                    containers: each running image becomes container:<image>, owned by
#                    containers_team (default dev); needs docker access for the agent
#   containers_team  owner of the container projects (default dev)
#   language_paths   directories under $HOME for the languages scan (default: uv tools,
#                    pipx venvs, ~/.cargo/bin, plus `npm root -g`)
[groups.servers]
team  = "sysadm"
kind  = "linux"
scans = ["system", "containers"]
hosts = ["server1", "server2", "server3"]

[groups.laptops]
team  = "users"
kind  = "macos"
scans = ["brew", "languages", "apps"]
hosts = ["laptop1", "laptop2"]

# ---- Per-host overrides (or a host without a group) ---------------------------------
# Any group setting, plus:
#   group    join a group without being in its hosts list
#   version  fixed DT project version (default: probed from the OS, e.g. debian-13)
[hosts.server1]
scans = ["system", "brew", "containers"]   # this one also has Homebrew

# ---- Application code ----------------------------------------------------------------
# A directory with the code *and* its installed dependencies (venv, node_modules) on one
# of the hosts above; that host's agent scans it into DT project code:<name>.
#   team     owner (default dev)
#   version  default: `git describe` in the directory
[code.myapp]
host = "server1"
path = "/srv/myapp"

# ---- Asset context: exposure and criticality (docs/exposure.md) ------------------------
# Set on what runs, never on a group: one group can run a public service and an internal
# admin page. Keys: exposure (internet | external-auth | internal | restricted |
# hostile-device), input (public | partner | staff), criticality (critical | high | normal |
# low), eol and certified (true/false). Unset stays unknown. They become Dependency-Track
# tags (exposure-internet, crit-high, ...) at the next dt2dojo round; preview with
# `python3 -m vulnflow context --unknown`.
# [hosts.server1]                  # the host project host:server1
# exposure = "internal"
# criticality = "normal"
# [hosts.server1.images]           # container projects on server1, by image name or glob
# "nginx" = { exposure = "internet", input = "public", criticality = "high" }
# "ghcr.io/acme/admin-*" = { exposure = "restricted", input = "staff" }
# "*" = { exposure = "internal" }  # the rest on this host (an exact name or longer glob wins)
# [hosts.server1.packages]         # packages in the host project (OS packages, modules in
# "nginx" = { exposure = "internet", input = "public" }   # its binaries); overrides the
# "openssh-server" = { exposure = "internet" }            # host's context when ranking
# [code.myapp] / [github.<name>] take the same keys.
# [projects."someapp"]             # any other project, e.g. uploaded from CI
# exposure = "external-auth"
# criticality = "critical"

# ---- CPE overrides for Homebrew and macOS apps ------------------------------------------
# Matched by CPE only; NVD's vendor can't be derived from Homebrew metadata (default guess:
# vendor = product). "<formula | cask | bundle id>" = "<nvd vendor>:<nvd product>".
[cpe_map]
# ripgrep = "burntsushi:ripgrep"
# "com.amazon.Lassen" = "amazon:kindle"

# ---- Extra OpenCVE subscriptions per team ---------------------------------------------
# Added to the team's [teams.<team>.opencve] in inventory/inventory.toml when
# `vulnflow sync` runs. Here rather than there because a detailed list shows your software
# stack and the repository is public. `python3 -m vulnflow suggest-subscriptions` prints
# candidates from what Dependency-Track has seen on the machines.
# [subscriptions.sysadm]
# vendors = ["nginx"]
# [subscriptions.sysadm.products]
# openbsd = ["openssh"]
# postgresql = ["postgresql"]

# ---- SBOMs from GitHub releases --------------------------------------------------------
# Projects that build on GitHub and attach a CycloneDX SBOM to each release. vulnflow pulls
# the newest one (python3 -m vulnflow github-sboms; dt2dojo every round), so GitHub needs no
# Dependency-Track key and no tailnet access. See docs/sboms.md "From GitHub releases".
# [github.someapp]                 # the Dependency-Track project name
# repo  = "owner/someapp"
# asset = "*.cdx.json"             # glob on the release asset names (default)
# team  = "dev"
