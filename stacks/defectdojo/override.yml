# Overlay for upstream DefectDojo's docker-compose.yml (poc.sh dojo-up passes both).
# Upstream's compose does not pass DD_ADMIN_PASSWORD to the initializer, so it would
# generate a random one and only print it to the log. DD_SECRET_KEY,
# DD_CREDENTIAL_AES_256_KEY, DJANGO_VERSION and NGINX_VERSION are read by upstream's
# compose from the environment (poc.sh exports them from .env), replacing its
# hard-coded keys and ":latest" images.
#
# Upstream sets no restart policy, so nothing of DefectDojo came back after a reboot.
# unless-stopped restarts the long-running services on boot unless they were stopped on
# purpose; the initializer is a one-shot job and keeps none.
x-restart: &restart
  restart: unless-stopped
services:
  postgres: *restart
  valkey: *restart
  celerybeat: *restart
  celeryworker: *restart
  initializer:
    environment:
      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD:?set DD_ADMIN_PASSWORD in .env (./poc.sh init)}"
  # Upstream doesn't pass these to uwsgi. Behind tailscale serve (HTTPS to the browser,
  # plain HTTP to nginx) Django's CSRF check rejects the https:// Origin of the login form
  # unless it is trusted. poc.sh writes both to .env from VULNFLOW_TS_HOST. Never leave
  # DD_CSRF_TRUSTED_ORIGINS empty: Django refuses an origin without a scheme.
  uwsgi:
    <<: *restart
    environment:
      DD_CSRF_TRUSTED_ORIGINS: "${DD_CSRF_TRUSTED_ORIGINS:-http://localhost:8280}"
      DD_SITE_URL: "${DD_SITE_URL:-http://localhost:8280}"
  # Upstream publishes nginx 8080/8443 on all interfaces. Docker-published ports
  # bypass an input-only host firewall, so bind them to 127.0.0.1 like the other
  # stacks (reach them over SSH or a reverse proxy).
  nginx:
    <<: *restart
    ports: !override
      - target: 8080
        published: ${DD_PORT:-8080}
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
      - target: 8443
        published: ${DD_TLS_PORT:-8443}
        host_ip: 127.0.0.1
        protocol: tcp
        mode: host
