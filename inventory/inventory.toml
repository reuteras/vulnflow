# Single source of truth for "what we run and who owns it".
# `python -m vulnflow sync` pushes this to OpenCVE (subscriptions per project),
# Dependency-Track (project tags) and DefectDojo (product types).
# In production, generate this file from the CMDB instead of editing by hand.

[priority]
# Tiers used by the webhook receiver (simple SSVC-inspired rules, tune to taste)
# P1 Act:     in KEV (CISA or other configured KEV) OR an 'exploited' sighting
# P2 Attend:  EPSS >= epss_attend  OR (CVSS >= cvss_critical AND EPSS >= epss_floor)
# P3 Track:   CVSS >= cvss_high
# P4 Watch:   everything else
epss_attend   = 0.10
epss_floor    = 0.01
cvss_critical = 9.0
cvss_high     = 7.0
# Only push P1..P(n) to chat; everything still goes to the JSONL log
chat_min_tier = 2
# OpenCVE event types to ignore entirely (e.g. pure reference churn)
ignore_event_types = ["references"]

# ---------------------------------------------------------------------------
# Three groups, each with its own OpenCVE project, DefectDojo product type and DT tag:
#   sysadm  the servers (OS packages, Homebrew on the servers)
#   users   the MacBooks (macOS, Homebrew, apps, language tools)
#   dev     code and containers (application dependencies, container images)
# A machine's `team` owns its host project; its containers and code go to dev (below).
[teams.sysadm]
display_name   = "Sysadmin"
opencve_project = "sysadm"
defectdojo_product_type = "Sysadmin"
dtrack_tag     = "team-sysadm"
chat_mention   = "@sysadm"

[teams.sysadm.opencve]
vendors  = []
[teams.sysadm.opencve.products]
debian    = ["debian_linux"]
canonical = ["ubuntu_linux"]
linux     = ["linux_kernel"]
# Add what the servers run (names are NVD's; see docs/install.md "Describe what you run" for how to
# check one): nginx, openssh, postgresql, ...

[teams.users]
display_name   = "Users"
opencve_project = "users"
defectdojo_product_type = "Users"
dtrack_tag     = "team-users"
chat_mention   = "@users"

[teams.users.opencve]
vendors  = []
[teams.users.opencve.products]
apple = ["macos"]
# Add the apps that matter (Homebrew and app SBOMs are matched by CPE only, so product
# subscriptions are the reliable signal for them).

[teams.dev]
display_name   = "Development"
opencve_project = "dev"
defectdojo_product_type = "Development"
dtrack_tag     = "team-dev"
chat_mention   = "@dev"

[teams.dev.opencve]
vendors  = ["python", "nodejs"]
[teams.dev.opencve.products]
postgresql = ["postgresql"]
# Libraries are better tracked by SBOM in Dependency-Track (purl/OSV/GHSA matching)
# than by CPE subscriptions here, because NVD no longer adds CPEs to most CVEs.

# ---------------------------------------------------------------------------
# Your own hosts (servers, laptops, code directories) are NOT listed here: they go in
# machines.toml (next to .env), which is kept out of git like .env. Start from
# machines.example.toml.
