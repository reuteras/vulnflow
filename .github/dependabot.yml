---
version: 2
updates:
  # Python dev tools (uv.lock); the runtime is stdlib only
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      # [dependency-groups] dev; auto-merged
      package-dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
      # [project] dependencies; reviewed by hand
      package-deps:
        dependency-type: "production"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"

  # deploy/Dockerfile base image (python:*-slim)
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-deps:
        patterns:
          - "*"

  # Dependency-Track + postgres images in stacks/dependency-track/docker-compose.yml, the
  # redis image the OpenCVE overlay sets (stacks/opencve/docker-compose.override.yaml), and
  # the optional local chat (stacks/mattermost: Mattermost + postgres).
  # DefectDojo and OpenCVE versions are git refs in .env (DD_REF, OPENCVE_REF), which
  # Dependabot can't see; bump those by hand after reading the release notes.
  - package-ecosystem: "docker-compose"
    directories:
      - "/stacks/dependency-track"
      - "/stacks/opencve"
      - "/stacks/mattermost"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      compose-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.github/osv-scanner"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
