---
name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib); 3.13 is what deploy/Dockerfile runs
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "${{ matrix.python-version }}"

      - name: Install dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  agent-py39:
    # scripts/vulnflow-agent.py runs on macOS's built-in Python 3.9 (the package needs 3.11)
    name: "Agent on Python 3.9"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Run the agent on Python 3.9
        run: |
          uv python install 3.9
          py="$(uv python find 3.9)"
          "$py" -I scripts/vulnflow-agent.py --help
          printf '%s' '{"vulnflow_agent_config": 1, "host": "ci", "dt_url": "https://dt.invalid",
            "host_project": null, "containers": null, "code": []}' > "$RUNNER_TEMP/agent.json"
          "$py" -I scripts/vulnflow-agent.py --config "$RUNNER_TEMP/agent.json" --dry-run
